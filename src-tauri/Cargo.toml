[package]
name = "motiondeck"
version = "0.1.0"
description = "MotionDeck — professional app motion graphics without the complexity."
authors = ["MotionDeck"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "motiondeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
device_query = "2"
which = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
